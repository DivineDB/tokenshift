name: Build & Commit Tokens CSS

on:
  push:
    branches: [ master, main ]
    paths:
      - "tokens/**"
      - "web/tokens/**"
      - "web/build-tokens.js"

permissions:
  contents: write

jobs:
  build-tokens:
    name: Build & Commit Tokens CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: cd web && (npm ci || npm install)

      - name: Compile design tokens
        run: cd web && node build-tokens.js

      - name: Commit compiled tokens.css
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-compile Figma tokens to CSS [skip ci]"
          file_pattern: "web/src/styles/tokens.css web/src/styles/tailwind-hint.json"
          commit_user_name: TokenShift Bot
          commit_user_email: tokenshift-bot@users.noreply.github.com

      - name: Token build summary
        if: always()
        run: |
          echo "## 🎨 TokenShift Token Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "web/src/styles/tokens.css" ]; then
            VAR_COUNT=$(grep -c "^  --" web/src/styles/tokens.css || true)
            echo "- ✅ **CSS Variables generated:** $VAR_COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- 📁 **Output:** \`web/src/styles/tokens.css\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🕐 **Triggered at:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
